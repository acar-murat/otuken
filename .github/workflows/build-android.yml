name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (see README, 'Cloud builds')."
            exit 1
          fi

      - name: Free disk space (the Android build image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Otuken-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Otuken-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          targetPlatform: Android
          buildMethod: Otuken.EditorTools.OtukenSetup.BuildAndroidCi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Otuken-Android
          path: Builds/Android/Otuken.apk
          if-no-files-found: error
