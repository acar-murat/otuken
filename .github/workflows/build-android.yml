name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (see README, 'Cloud builds')."
            exit 1
          fi

      - name: Free disk space (the Android build image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # The Unity image brings its own Android SDK, so the runner's copy and other toolchains can all go.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Otuken-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Otuken-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          # unity-builder v4 defaults to image series 3, which has no 6000.3.29f1 build; series 4 does.
          customImage: unityci/editor:ubuntu-6000.3.29f1-android-4
          targetPlatform: Android
          buildMethod: Otuken.EditorTools.OtukenSetup.BuildAndroidCi

      # Between releases, builds carry SemVer build metadata: VERSION+run number (e.g. 0.1.0+42).
      - name: Name APK with its version
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          sudo cp Builds/Android/Otuken.apk "Otuken-${V}+${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Otuken-Android
          path: 'Otuken-*.apk'
          if-no-files-found: error
